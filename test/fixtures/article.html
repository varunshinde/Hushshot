<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Long article fixture</title>
<style>
  html, body { margin: 0; background: #fff; color: #1a1a1a; }
  #page { position: relative; height: 25000px; overflow: hidden; }
  main { margin-left: 40px; max-width: 880px; padding: 24px; font: 18px/1.6 Georgia, serif; }
  h1 { font: 700 34px/1.2 Helvetica, Arial, sans-serif; }
  h2 { font: 700 24px/1.3 Helvetica, Arial, sans-serif; margin-top: 36px; }
  li { margin: 4px 0; }
  .band { height: 40px; margin: 20px 0; background: linear-gradient(90deg, #e8f0ff, #ffe8f0); }
</style>
<script src="ruler.js"></script>
</head>
<body>
<div id="page">
  <main id="content"><h1>A very long article for stitching tests</h1></main>
</div>
<script>
  drawRuler(document.getElementById('page'), 25000);
  const main = document.getElementById('content');
  const sentence = prose(7);
  let section = 1;
  while (main.offsetHeight < 24400) {
    const h = document.createElement('h2');
    h.textContent = `Section ${section++}: ${sentence(4).slice(0, -1)}`;
    main.appendChild(h);
    for (let p = 0; p < 4 && main.offsetHeight < 24400; p++) {
      const el = document.createElement('p');
      el.textContent = Array.from({ length: 4 }, () => sentence(12)).join(' ');
      main.appendChild(el);
    }
    if (section % 3 === 0) {
      const ul = document.createElement('ul');
      for (let i = 0; i < 3; i++) { const li = document.createElement('li'); li.textContent = sentence(8); ul.appendChild(li); }
      main.appendChild(ul);
      const band = document.createElement('div'); band.className = 'band'; main.appendChild(band);
    }
  }
</script>
</body>
</html>
