<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pagination fixture</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #1d2a32; font: 17px/1.6 Georgia, serif; }
  header { position: sticky; top: 0; height: 56px; background: #1d2a32; color: #fff; display: flex; align-items: center; padding: 0 40px; font: 600 18px Arial, sans-serif; z-index: 3; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 40px 80px; }
  h1 { font: 700 44px/1.15 Arial, sans-serif; margin: 20px 0; }
  h2 { font: 700 28px/1.3 Arial, sans-serif; margin: 40px 0 10px; }
  p.small { font-size: 14px; line-height: 1.45; }
  p.big { font-size: 22px; line-height: 1.7; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .cols p:nth-child(2) { font-size: 15px; line-height: 1.9; }
  pre { background: #f3f5f7; padding: 16px; font: 14px/1.5 Menlo, monospace; white-space: pre-wrap; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font: 15px/1.4 Arial, sans-serif; }
  td, th { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
  .box { border-radius: 10px; display: block; width: 100%; }
  figure { margin: 24px 0; }
  figcaption { font: 13px Arial, sans-serif; color: #667; }
</style>
<script src="ruler.js"></script>
</head>
<body>
<header>Pagination fixture</header>
<main id="content"></main>
<script>
  // Deterministic mixed content: text in several sizes, images of many heights,
  // a two-column block whose line rhythms differ, code, a table and a canvas.
  const s = prose(11), main = document.getElementById('content');
  const add = (html) => main.insertAdjacentHTML('beforeend', html);
  const img = (h, hue) => {
    const c = document.createElement('canvas'); c.width = 820; c.height = h;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 820, h); grad.addColorStop(0, `hsl(${hue},55%,65%)`); grad.addColorStop(1, `hsl(${hue + 40},55%,40%)`);
    g.fillStyle = grad; g.fillRect(0, 0, 820, h);
    return `<figure><img class="box" width="820" height="${h}" alt="" src="${c.toDataURL()}"><figcaption>Figure, ${h}px tall</figcaption></figure>`;
  };
  add('<h1>Pagination fixture: mixed content</h1>');
  const heights = [180, 420, 260, 640, 90, 980, 330, 1500, 210, 520];
  for (let i = 0; i < 10; i++) {
    add(`<h2>Part ${i + 1}: ${s(4)}</h2>`);
    for (let j = 0; j < 3; j++) add(`<p>${s(60)}</p>`);
    add(`<p class="${i % 2 ? 'small' : 'big'}">${s(45)}</p>`);
    add(img(heights[i], i * 33));
    if (i % 3 === 1) add(`<div class="cols"><p>${s(110)}</p><p>${s(100)}</p></div>`);
    if (i % 4 === 2) add(`<pre>${Array.from({ length: 14 }, (_, k) => `line ${k + 1}: ${s(8)}`).join('\n')}</pre>`);
    if (i % 4 === 3) add(`<table><tr><th>Name</th><th>Value</th><th>Notes</th></tr>${Array.from({ length: 8 }, (_, k) => `<tr><td>${s(2)}</td><td>${k * 37}</td><td>${s(6)}</td></tr>`).join('')}</table>`);
    for (let j = 0; j < 2; j++) add(`<p>${s(50)}</p>`);
  }
</script>
</body>
</html>
